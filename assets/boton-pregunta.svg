<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 104" width="620" height="104" role="img" aria-label="Pregúntanos — nuestro asistente de IA te responde en segundos">
  <defs>
    <linearGradient id="btnFondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150E26"/>
      <stop offset="100%" stop-color="#2A1B4A"/>
    </linearGradient>
    <linearGradient id="btnBorde" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="barridoBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="recorteBtn">
      <rect x="8" y="8" width="604" height="88" rx="16"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="612" height="96" rx="20" fill="none" stroke="#A855F7" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.32;0.02;0.32" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="4;1;4" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="4;1;4" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="612;618;612" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="96;102;96" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <rect x="8" y="8" width="604" height="88" rx="16" fill="url(#btnFondo)" stroke="url(#btnBorde)" stroke-width="1.6"/>

  <g clip-path="url(#recorteBtn)">
    <rect x="-240" y="8" width="240" height="88" fill="url(#barridoBtn)">
      <animate attributeName="x" values="-240;620" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(44,52)">
    <circle r="6" fill="#34D399" fill-opacity="0.25">
      <animate attributeName="r" values="6;14;6" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#34D399"/>
  </g>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="76" y="47" font-size="24" font-weight="700" fill="#FAF5FF">Pregúntanos</text>
    <text x="76" y="72" font-size="14" fill="#9C8FB5">Nuestro asistente de IA te responde en segundos · Ask us anything</text>
  </g>

  <g stroke="#C084FC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g>
      <path d="M552 52h26M568 42l10 10-10 10"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
