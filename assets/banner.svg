<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Xentris Tech — Más que tecnología, soluciones que impulsan tu crecimiento. Software a medida, cloud y DevOps, IA y automatización, transformación digital y ciberseguridad.">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0714"/>
      <stop offset="55%" stop-color="#150E26"/>
      <stop offset="100%" stop-color="#1E1338"/>
    </linearGradient>

    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="barrido" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>

    <pattern id="rejilla" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#A855F7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#fondo)"/>
  <rect width="1200" height="320" fill="url(#rejilla)"/>
  <ellipse cx="990" cy="80" rx="400" ry="260" fill="url(#halo)"/>

  <!-- las 4 areas, encendiendose en secuencia -->
  <g transform="translate(880,232)" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#8B7BA8">
    <g>
      <rect x="0" y="-14" width="230" height="1.5" fill="#A855F7" fill-opacity="0.22"/>
      <rect x="0" y="-14" width="58" height="1.5" fill="url(#barrido)">
        <animate attributeName="x" values="0;172;0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="0" y="8">software · cloud · IA · seguridad</text>
  </g>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="80" y="116" font-size="60" font-weight="700" fill="#FAF5FF" letter-spacing="-1">Xentris Tech</text>

    <rect x="80" y="140" width="150" height="3" rx="1.5" fill="url(#marca)"/>
    <rect x="80" y="140" width="150" height="3" rx="1.5" fill="url(#barrido)">
      <animate attributeName="x" values="80;1000;80" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <text x="80" y="190" font-size="25" font-weight="600" fill="#C084FC">Más que tecnología, soluciones que impulsan tu crecimiento</text>
    <text x="80" y="219" font-size="15" font-style="italic" fill="#9C8FB5">More than technology — solutions that drive your growth</text>

    <!-- la frase de marca, con peso propio -->
    <g transform="translate(80,248)">
      <rect x="0" y="0" width="196" height="34" rx="17" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="20" cy="17" r="4.5" fill="#34D399">
        <animate attributeName="fill-opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="22" font-size="15" font-weight="700" fill="#F5F3FF">0 humo. Solo resultados.</text>
    </g>

    <text x="80" y="303" font-size="13" fill="#7C6F93">XENTRIS LLC · Merrick, New York · info@xentris.tech</text>
  </g>

  <rect x="0" y="316" width="1200" height="4" fill="url(#marca)"/>
</svg>
