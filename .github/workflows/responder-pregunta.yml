name: Responder pregunta

# Contesta con IA los Issues abiertos con la plantilla "Pregunta".
# Solo actúa sobre Issues con la etiqueta 'pregunta', que la plantilla aplica sola.

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: pregunta-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    # Puertas antes de gastar un token: etiqueta correcta y autor humano.
    if: >-
      contains(github.event.issue.labels.*.name, 'pregunta') &&
      github.event.issue.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar y publicar respuesta
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/responder-pregunta.mjs
