name: Answer question

# Replies with AI to Issues opened through the "Ask us anything" template.
# Only acts on Issues carrying the 'question' label, which the template applies.
#
# Requires the OPENAI_API_KEY secret in:
#   Settings → Secrets and variables → Actions → New repository secret

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: question-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    # Gates before spending a token: right label, human author.
    if: >-
      contains(github.event.issue.labels.*.name, 'question') &&
      github.event.issue.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and post the answer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/answer-question.mjs
